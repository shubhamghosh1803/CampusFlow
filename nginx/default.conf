upstream campusflow_backends {
    server backend1:8000 max_fails=1 fail_timeout=5s;
    server backend2:8000 max_fails=1 fail_timeout=5s;
    server backend3:8000 max_fails=1 fail_timeout=5s;
}


server {
    listen 80;

    location / {
        proxy_pass http://campusflow_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        proxy_next_upstream error timeout http_502 http_503 http_504;

        add_header X-Backend $upstream_addr always;
    }
}